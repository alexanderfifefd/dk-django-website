[project]
name = "dk-django-website"
version = "0.1.0"
description = "Prototypes exploring a markdown-driven Django website"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "pydantic>=2.13.4",
    "python-frontmatter>=1.3.0",
    "pygments>=2.19.0",
    "email-validator>=2.3.0",
    "django-debug-toolbar>=8.0.0",
]
