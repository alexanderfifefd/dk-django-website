<li>
  <a href="{% url 'system_detail' system.slug %}">{{ system.title }}</a>
  <span class="stage-badge stage-badge-{{ system.stage }}">{{ system.get_stage_display }}</span>
  {% if system.url %}
    <a class="system-url" href="{{ system.url }}" rel="noopener noreferrer">{{ system.url|cut:"https://" }}</a>
  {% endif %}
  {% if system.summary %}<p>{{ system.summary }}</p>{% endif %}
</li>
